<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>AlmaConnect - Alumni Network</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <!-- Font Awesome & Google Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            transition: background-color 0.2s ease, color 0.2s ease, border-color 0.2s;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.5;
        }

        /* Light/Dark Variables */
        :root {
            --bg-primary: #f8fafc;
            --bg-secondary: #ffffff;
            --bg-card: #ffffff;
            --text-primary: #0f172a;
            --text-secondary: #334155;
            --border: #e2e8f0;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --accent-soft: #dbeafe;
            --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05), 0 2px 4px -2px rgb(0 0 0 / 0.05);
            --header-bg: rgba(255,255,255,0.8);
        }

        body.dark {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-card: #1e293b;
            --text-primary: #f1f5f9;
            --text-secondary: #cbd5e1;
            --border: #334155;
            --accent: #60a5fa;
            --accent-hover: #3b82f6;
            --accent-soft: #1e293b;
            --header-bg: rgba(15,23,42,0.9);
        }

        /* Layout */
        .container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 1rem;
        }

        /* Header / Nav */
        .navbar {
            backdrop-filter: blur(12px);
            background: var(--header-bg);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .nav-flex {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            padding: 0.8rem 1rem;
        }
        .logo {
            font-weight: 700;
            font-size: 1.5rem;
            background: linear-gradient(135deg, var(--accent), #8b5cf6);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .nav-links {
            display: flex;
            gap: 1.2rem;
            align-items: center;
            flex-wrap: wrap;
        }
        .nav-btn {
            background: none;
            border: none;
            font-size: 1rem;
            cursor: pointer;
            padding: 0.4rem 0.8rem;
            border-radius: 2rem;
            font-weight: 500;
            color: var(--text-secondary);
            transition: all 0.2s;
        }
        .nav-btn.active {
            background: var(--accent-soft);
            color: var(--accent);
        }
        .nav-btn:hover {
            background: var(--border);
            color: var(--text-primary);
        }
        .theme-toggle, .logout-btn {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            padding: 0.4rem 0.9rem;
            border-radius: 2rem;
            cursor: pointer;
            font-weight: 500;
        }

        /* Cards & grids */
        .profile-grid, .events-grid, .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
            margin-top: 1.5rem;
        }
        .card {
            background: var(--bg-card);
            border-radius: 1.5rem;
            border: 1px solid var(--border);
            padding: 1.2rem;
            box-shadow: var(--shadow);
            transition: transform 0.1s ease;
        }
        .profile-card {
            cursor: pointer;
        }
        .profile-card:hover {
            transform: translateY(-3px);
            border-color: var(--accent);
        }
        .profile-name {
            font-size: 1.3rem;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
        }
        .like-btn {
            background: none;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
            color: #ef4444;
        }
        .detail-section {
            background: var(--bg-card);
            border-radius: 1.25rem;
            padding: 1.5rem;
            margin-top: 1rem;
            border: 1px solid var(--border);
        }
        .whatsapp-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: #25D36620;
            color: #25D366;
            padding: 0.3rem 1rem;
            border-radius: 2rem;
            text-decoration: none;
            font-weight: 500;
            margin-top: 0.5rem;
        }
        .flex-between {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        button {
            background: var(--accent);
            border: none;
            padding: 0.5rem 1.2rem;
            border-radius: 2rem;
            color: white;
            font-weight: 500;
            cursor: pointer;
        }
        input, textarea {
            width: 100%;
            padding: 0.7rem;
            margin-bottom: 0.8rem;
            border-radius: 1rem;
            border: 1px solid var(--border);
            background: var(--bg-primary);
            color: var(--text-primary);
        }
        .hidden {
            display: none;
        }
        .alert {
            background: #ef444410;
            border-left: 4px solid #ef4444;
            padding: 0.8rem;
            border-radius: 1rem;
            margin: 1rem 0;
        }
        .event-item, .gallery-item {
            background: var(--bg-secondary);
        }
        .gallery-img {
            width: 100%;
            height: 160px;
            object-fit: cover;
            border-radius: 1rem;
            background: #cbd5e1;
        }
        footer {
            text-align: center;
            padding: 2rem 0;
            border-top: 1px solid var(--border);
            margin-top: 2rem;
        }
        @media (max-width: 640px) {
            .nav-flex { flex-direction: column; align-items: stretch; }
            .nav-links { justify-content: center; }
        }
    </style>
</head>
<body>

<div class="navbar">
    <div class="container nav-flex">
        <div class="logo"><i class="fas fa-graduation-cap"></i> AlmaConnect</div>
        <div class="nav-links">
            <button class="nav-btn" data-nav="profiles"><i class="fas fa-users"></i> Profiles</button>
            <button class="nav-btn" data-nav="events"><i class="fas fa-calendar-alt"></i> Events</button>
            <button class="nav-btn" data-nav="gallery"><i class="fas fa-images"></i> Gallery</button>
            <button id="themeToggleBtn" class="theme-toggle"><i class="fas fa-moon"></i> Dark</button>
            <button id="logoutBtn" class="logout-btn hidden"><i class="fas fa-sign-out-alt"></i> Logout</button>
        </div>
    </div>
</div>

<div class="container" id="app-container">
    <!-- Auth Forms (Login/Register) -->
    <div id="authSection">
        <div class="detail-section" style="max-width: 480px; margin: 2rem auto;">
            <h2 style="text-align:center">Alumni Network</h2>
            <div id="authTabs" class="flex-between" style="margin-bottom: 1rem;">
                <button id="showLoginBtn" class="nav-btn active">Login</button>
                <button id="showRegisterBtn" class="nav-btn">Register</button>
            </div>
            <div id="loginForm">
                <input type="email" id="loginEmail" placeholder="Email" autocomplete="email">
                <input type="password" id="loginPassword" placeholder="Password">
                <button id="doLogin">Login <i class="fas fa-arrow-right"></i></button>
                <div id="loginError" class="alert hidden"></div>
            </div>
            <div id="registerForm" class="hidden">
                <input type="text" id="regFullname" placeholder="Full Name *">
                <input type="email" id="regEmail" placeholder="Email *">
                <input type="password" id="regPassword" placeholder="Password *">
                <input type="text" id="regAddress" placeholder="Address">
                <textarea id="regBio" rows="2" placeholder="Biography (e.g., batch, achievements)"></textarea>
                <input type="tel" id="regPhone" placeholder="Phone Number">
                <input type="tel" id="regWhatsapp" placeholder="WhatsApp Number (with country code)">
                <button id="doRegister">Create Account & Create Profile</button>
                <div id="regError" class="alert hidden"></div>
            </div>
        </div>
    </div>

    <!-- Main App (after login) -->
    <div id="mainApp" class="hidden">
        <!-- Shared Profiles Section -->
        <div id="profilesSection">
            <div class="flex-between" style="margin-bottom: 1rem;">
                <h2><i class="fas fa-id-card"></i> Alumni Profiles</h2>
                <button id="createProfileBtn"><i class="fas fa-plus"></i> My Profile</button>
            </div>
            <div id="profilesList" class="profile-grid">Loading profiles...</div>
        </div>

        <!-- Events Section -->
        <div id="eventsSection" class="hidden">
            <div class="flex-between">
                <h2><i class="fas fa-calendar-alt"></i> Upcoming Events</h2>
                <button id="addEventBtn"><i class="fas fa-plus"></i> Add Event</button>
            </div>
            <div id="eventsList" class="events-grid">Loading events...</div>
        </div>

        <!-- Gallery Section -->
        <div id="gallerySection" class="hidden">
            <div class="flex-between">
                <h2><i class="fas fa-school"></i> School Gallery</h2>
                <button id="addImageBtn"><i class="fas fa-image"></i> Add Image URL</button>
            </div>
            <div id="galleryList" class="gallery-grid">Loading gallery...</div>
        </div>
    </div>

    <!-- Profile Modal (Create/Edit) -->
    <div id="profileModal" class="hidden" style="position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); z-index:1000; display:flex; align-items:center; justify-content:center;">
        <div class="detail-section" style="width:90%; max-width:500px; max-height:80vh; overflow:auto;">
            <h3 id="modalTitle">Create/Edit Your Profile</h3>
            <input type="text" id="modalFullname" placeholder="Full Name *">
            <input type="text" id="modalAddress" placeholder="Address">
            <textarea id="modalBio" rows="3" placeholder="Biography (batch, interests)"></textarea>
            <input type="tel" id="modalPhone" placeholder="Phone Number">
            <input type="tel" id="modalWhatsapp" placeholder="WhatsApp Number">
            <div class="flex-between" style="margin-top: 1rem;">
                <button id="saveProfileBtn">Save Profile</button>
                <button id="closeModalBtn" style="background:#64748b;">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Event Modal -->
    <div id="eventModal" class="hidden" style="position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); z-index:1000; display:flex; align-items:center; justify-content:center;">
        <div class="detail-section" style="width:90%; max-width:450px;">
            <h3>Add Event</h3>
            <input type="text" id="eventTitle" placeholder="Event title">
            <input type="date" id="eventDate">
            <textarea id="eventDesc" placeholder="Description"></textarea>
            <button id="saveEventBtn">Create Event</button>
            <button id="closeEventBtn" style="background:#64748b;">Cancel</button>
        </div>
    </div>
    <!-- Gallery Image URL Modal -->
    <div id="galleryModal" class="hidden" style="position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); z-index:1000; display:flex; align-items:center; justify-content:center;">
        <div class="detail-section" style="width:90%; max-width:450px;">
            <h3>Add School Image</h3>
            <input type="url" id="imageUrl" placeholder="Image URL (https://...)" >
            <input type="text" id="imageCaption" placeholder="Caption (optional)">
            <button id="saveGalleryBtn">Add to Gallery</button>
            <button id="closeGalleryBtn" style="background:#64748b;">Cancel</button>
        </div>
    </div>
</div>
<footer>© 2025 AlmaConnect — Reconnect & Thrive</footer>

<script>
    // Firebase Config (Replace with your own or use demo but it's safe for demo)
    // For a working demo, I'll provide a config that uses Firestore emulator? No, use real test project.
    // Important: In production you must replace with your own Firebase project.
    // For local / GitHub Pages, you must use your own Firebase credentials.
    // This template uses a placeholder - YOU must replace <your config> with actual Firebase config.
    // For demonstration, it will show error if not configured. But I'll add a mock fallback? Better use valid project details:
    // I will use my test config (but for security, user can replace). To ensure it works on GitHub Pages, user needs to create Firebase project.
    // Provide instructions inside comments. Meanwhile, I'll embed a working demo-like structure with proper error msg.
    // For this answer to function independent, I'm using a public test project: BUT It's not allowed to expose private keys;
    // I will use a dummy config and guide to replace. But since it's a simulation, I'll provide robust ready-to-use firebase init with proper placeholders.
    // For CODE to run without config, it will show error. Provide replace instructions.

    // ✅ Replace these values with your own Firebase project config (from Firebase Console)
    const firebaseConfig = {
        apiKey: "YOUR_API_KEY",            // Replace
        authDomain: "YOUR_AUTH_DOMAIN",
        projectId: "YOUR_PROJECT_ID",
        storageBucket: "YOUR_BUCKET",
        messagingSenderId: "YOUR_SENDER_ID",
        appId: "YOUR_APP_ID"
    };
    // ===== IMPORTANT: To run, create Firebase project, enable Email/Password Auth, Firestore, set rules accordingly.
    // If config not valid, app shows warning instead of breaking.
    
    let app, auth, db;
    let currentUser = null;
    let currentProfileId = null;
    let activeNav = "profiles";

    try {
        if(firebaseConfig.apiKey !== "YOUR_API_KEY") {
            app = firebase.initializeApp(firebaseConfig);
            auth = firebase.auth();
            db = firebase.firestore();
        } else {
            console.warn("Firebase config missing. Using demo offline mode? but features limited. Provide valid config.");
            // fallback dummy to avoid critical errors
            document.getElementById("authSection").innerHTML = '<div class="alert">⚠️ Please configure Firebase (see script comments).</div>';
        }
    } catch(e) { console.error(e); }

    // DOM elements
    const authSection = document.getElementById("authSection");
    const mainApp = document.getElementById("mainApp");
    const loginFormDiv = document.getElementById("loginForm");
    const registerFormDiv = document.getElementById("registerForm");
    const showLoginBtn = document.getElementById("showLoginBtn");
    const showRegisterBtn = document.getElementById("showRegisterBtn");
    const doLogin = document.getElementById("doLogin");
    const doRegister = document.getElementById("doRegister");
    const logoutBtn = document.getElementById("logoutBtn");
    const themeToggle = document.getElementById("themeToggleBtn");
    const profilesSection = document.getElementById("profilesSection");
    const eventsSection = document.getElementById("eventsSection");
    const gallerySection = document.getElementById("gallerySection");
    const profilesListDiv = document.getElementById("profilesList");
    const eventsListDiv = document.getElementById("eventsList");
    const galleryListDiv = document.getElementById("galleryList");
    const createProfileBtn = document.getElementById("createProfileBtn");
    const profileModal = document.getElementById("profileModal");
    const eventModal = document.getElementById("eventModal");
    const galleryModal = document.getElementById("galleryModal");
    const addEventBtn = document.getElementById("addEventBtn");
    const addImageBtn = document.getElementById("addImageBtn");

    // Helper: check auth
    function updateUIForUser(user) {
        if(user && db) {
            authSection.classList.add("hidden");
            mainApp.classList.remove("hidden");
            logoutBtn.classList.remove("hidden");
            loadProfiles();
            loadEvents();
            loadGallery();
            checkUserProfileExists(user.uid);
        } else {
            authSection.classList.remove("hidden");
            mainApp.classList.add("hidden");
            logoutBtn.classList.add("hidden");
            currentUser = null;
        }
    }

    async function checkUserProfileExists(uid) {
        if(!db) return;
        const snapshot = await db.collection("profiles").where("userId", "==", uid).get();
        if(!snapshot.empty) {
            currentProfileId = snapshot.docs[0].id;
        } else {
            currentProfileId = null;
        }
    }

    async function loadProfiles() {
        if(!db) { profilesListDiv.innerHTML = "<div>Firebase not ready</div>"; return; }
        const snapshot = await db.collection("profiles").get();
        if(snapshot.empty) { profilesListDiv.innerHTML = "<div>No alumni profiles yet. Create yours!</div>"; return; }
        let html = "";
        snapshot.forEach(doc => {
            const data = doc.data();
            const likes = data.likes || 0;
            html += `<div class="card profile-card" data-id="${doc.id}">
                        <div class="profile-name">${escapeHtml(data.fullname || "Anonymous")} 
                            <button class="like-btn" data-id="${doc.id}"><i class="fas fa-heart"></i> ${likes}</button>
                        </div>
                        <div><i class="fas fa-map-marker-alt"></i> ${escapeHtml(data.address || "Not specified")}</div>
                        <div><i class="fas fa-align-left"></i> ${escapeHtml(data.bio?.substring(0,80) || "No bio")}</div>
                        <div><i class="fas fa-phone"></i> ${escapeHtml(data.phone || "")}</div>
                        ${data.whatsapp ? `<a href="https://wa.me/${data.whatsapp.replace(/\D/g,'')}" target="_blank" class="whatsapp-link"><i class="fab fa-whatsapp"></i> Chat on WhatsApp</a>` : ''}
                     </div>`;
        });
        profilesListDiv.innerHTML = html;
        document.querySelectorAll('.like-btn').forEach(btn => {
            btn.addEventListener('click', async (e) => {
                e.stopPropagation();
                const pid = btn.getAttribute('data-id');
                const profileRef = db.collection("profiles").doc(pid);
                const docSnap = await profileRef.get();
                const currentLikes = docSnap.data()?.likes || 0;
                await profileRef.update({ likes: currentLikes + 1 });
                loadProfiles();
            });
        });
        document.querySelectorAll('.profile-card').forEach(card => {
            card.addEventListener('click', (e) => {
                if(e.target.classList.contains('like-btn')) return;
                const id = card.getAttribute('data-id');
                viewProfileDetail(id);
            });
        });
    }

    async function viewProfileDetail(profileId) {
        const doc = await db.collection("profiles").doc(profileId).get();
        if(!doc.exists) return;
        const data = doc.data();
        alert(`📌 Full Name: ${data.fullname}\n📍 Address: ${data.address}\n📖 Bio: ${data.bio}\n📞 Phone: ${data.phone}\n💬 WhatsApp: ${data.whatsapp}\n❤️ Likes: ${data.likes || 0}`);
    }

    async function loadEvents() {
        if(!db) return;
        const snap = await db.collection("events").orderBy("date", "desc").get();
        if(snap.empty) { eventsListDiv.innerHTML = "<div>No events scheduled.</div>"; return; }
        let html = "";
        snap.forEach(doc => {
            const e = doc.data();
            html += `<div class="card event-item"><h3>${escapeHtml(e.title)}</h3><div><i class="far fa-calendar"></i> ${e.date}</div><p>${escapeHtml(e.description)}</p></div>`;
        });
        eventsListDiv.innerHTML = html;
    }

    async function loadGallery() {
        if(!db) return;
        const snap = await db.collection("gallery").orderBy("timestamp", "desc").get();
        if(snap.empty) { galleryListDiv.innerHTML = "<div>No images yet. Share school memories.</div>"; return; }
        let html = "";
        snap.forEach(doc => {
            const img = doc.data();
            html += `<div class="card gallery-item"><img src="${escapeHtml(img.url)}" class="gallery-img" onerror="this.src='https://via.placeholder.com/300?text=Invalid+URL'"><p>${escapeHtml(img.caption || 'School memory')}</p></div>`;
        });
        galleryListDiv.innerHTML = html;
    }

    // Profile create/edit
    createProfileBtn.onclick = () => {
        if(currentProfileId) {
            db.collection("profiles").doc(currentProfileId).get().then(doc => {
                if(doc.exists) {
                    document.getElementById("modalFullname").value = doc.data().fullname || "";
                    document.getElementById("modalAddress").value = doc.data().address || "";
                    document.getElementById("modalBio").value = doc.data().bio || "";
                    document.getElementById("modalPhone").value = doc.data().phone || "";
                    document.getElementById("modalWhatsapp").value = doc.data().whatsapp || "";
                }
            });
        } else {
            document.getElementById("modalFullname").value = "";
            document.getElementById("modalAddress").value = "";
            document.getElementById("modalBio").value = "";
            document.getElementById("modalPhone").value = "";
            document.getElementById("modalWhatsapp").value = "";
        }
        profileModal.classList.remove("hidden");
        profileModal.style.display = "flex";
    };
    document.getElementById("saveProfileBtn").onclick = async () => {
        const fullname = document.getElementById("modalFullname").value.trim();
        if(!fullname) { alert("Full name required"); return; }
        const profileData = {
            fullname, address: document.getElementById("modalAddress").value,
            bio: document.getElementById("modalBio").value,
            phone: document.getElementById("modalPhone").value,
            whatsapp: document.getElementById("modalWhatsapp").value,
            userId: currentUser.uid,
            likes: 0
        };
        if(currentProfileId) {
            await db.collection("profiles").doc(currentProfileId).update(profileData);
        } else {
            const newRef = await db.collection("profiles").add(profileData);
            currentProfileId = newRef.id;
        }
        profileModal.classList.add("hidden");
        profileModal.style.display = "none";
        loadProfiles();
    };
    document.getElementById("closeModalBtn").onclick = () => { profileModal.classList.add("hidden"); profileModal.style.display = "none"; };

    // Events logic
    addEventBtn.onclick = () => { eventModal.classList.remove("hidden"); eventModal.style.display = "flex"; };
    document.getElementById("saveEventBtn").onclick = async () => {
        const title = document.getElementById("eventTitle").value.trim();
        const date = document.getElementById("eventDate").value;
        const desc = document.getElementById("eventDesc").value;
        if(!title || !date) { alert("Title and date required"); return; }
        await db.collection("events").add({ title, date, description: desc, createdBy: currentUser.uid });
        eventModal.classList.add("hidden"); eventModal.style.display = "none";
        loadEvents();
        document.getElementById("eventTitle").value = "";
        document.getElementById("eventDate").value = "";
        document.getElementById("eventDesc").value = "";
    };
    document.getElementById("closeEventBtn").onclick = () => { eventModal.classList.add("hidden"); eventModal.style.display = "none"; };

    addImageBtn.onclick = () => { galleryModal.classList.remove("hidden"); galleryModal.style.display = "flex"; };
    document.getElementById("saveGalleryBtn").onclick = async () => {
        const url = document.getElementById("imageUrl").value.trim();
        if(!url) { alert("Image URL required"); return; }
        await db.collection("gallery").add({ url, caption: document.getElementById("imageCaption").value, timestamp: Date.now() });
        galleryModal.classList.add("hidden"); galleryModal.style.display = "none";
        loadGallery();
        document.getElementById("imageUrl").value = "";
        document.getElementById("imageCaption").value = "";
    };
    document.getElementById("closeGalleryBtn").onclick = () => { galleryModal.classList.add("hidden"); galleryModal.style.display = "none"; };

    // Auth handlers
    if(auth) {
        auth.onAuthStateChanged(user => { currentUser = user; updateUIForUser(user); });
        doLogin.onclick = async () => {
            const email = document.getElementById("loginEmail").value;
            const pwd = document.getElementById("loginPassword").value;
            try { await auth.signInWithEmailAndPassword(email, pwd); }
            catch(e) { document.getElementById("loginError").innerText = e.message; document.getElementById("loginError").classList.remove("hidden"); }
        };
        doRegister.onclick = async () => {
            const email = document.getElementById("regEmail").value;
            const pwd = document.getElementById("regPassword").value;
            const fullname = document.getElementById("regFullname").value;
            if(!fullname || !email || !pwd) { alert("Full name, email, password required"); return; }
            try {
                const cred = await auth.createUserWithEmailAndPassword(email, pwd);
                await db.collection("profiles").add({
                    fullname, address: document.getElementById("regAddress").value,
                    bio: document.getElementById("regBio").value,
                    phone: document.getElementById("regPhone").value,
                    whatsapp: document.getElementById("regWhatsapp").value,
                    userId: cred.user.uid, likes: 0
                });
                // auto login
            } catch(e) { document.getElementById("regError").innerText = e.message; document.getElementById("regError").classList.remove("hidden"); }
        };
        logoutBtn.onclick = () => auth.signOut();
    }
    showLoginBtn.onclick = () => { loginFormDiv.classList.remove("hidden"); registerFormDiv.classList.add("hidden"); showLoginBtn.classList.add("active"); showRegisterBtn.classList.remove("active"); };
    showRegisterBtn.onclick = () => { loginFormDiv.classList.add("hidden"); registerFormDiv.classList.remove("hidden"); showRegisterBtn.classList.add("active"); showLoginBtn.classList.remove("active"); };

    // Navigation
    document.querySelectorAll("[data-nav]").forEach(btn => {
        btn.addEventListener("click", (e) => {
            activeNav = e.target.getAttribute("data-nav");
            profilesSection.classList.add("hidden");
            eventsSection.classList.add("hidden");
            gallerySection.classList.add("hidden");
            if(activeNav === "profiles") profilesSection.classList.remove("hidden");
            if(activeNav === "events") eventsSection.classList.remove("hidden");
            if(activeNav === "gallery") gallerySection.classList.remove("hidden");
        });
    });
    // Dark mode
    if(localStorage.getItem("theme") === "dark") document.body.classList.add("dark");
    themeToggle.onclick = () => { document.body.classList.toggle("dark"); localStorage.setItem("theme", document.body.classList.contains("dark") ? "dark" : "light"); };
    function escapeHtml(str) { if(!str) return ''; return str.replace(/[&<>]/g, function(m){if(m==='&') return '&amp;'; if(m==='<') return '&lt;'; if(m==='>') return '&gt;'; return m;}); }
    // Initialize nav default profiles
    profilesSection.classList.remove("hidden");
    eventsSection.classList.add("hidden");
    gallerySection.classList.add("hidden");
</script>
</body>
</html>
