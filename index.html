<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Sa'adah Alumni Connect | Official Portal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Poppins', system-ui, -apple-system, 'Inter', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #eef5e6 0%, #c8e6c9 100%);
            min-height: 100vh;
        }

        .app-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px 24px 40px;
        }

        /* Cards & UI */
        .card {
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(2px);
            border-radius: 32px;
            box-shadow: 0 20px 35px -12px rgba(0, 32, 0, 0.25);
            padding: 28px 32px;
            border: 1px solid rgba(70, 130, 70, 0.25);
        }

        .btn {
            border: none;
            background: #2e7d32;
            color: white;
            font-weight: 600;
            padding: 12px 28px;
            border-radius: 60px;
            cursor: pointer;
            font-size: 0.95rem;
            transition: 0.2s;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }

        .btn:hover {
            background: #1b5e20;
            transform: scale(1.02);
        }

        .btn-outline {
            background: transparent;
            border: 2px solid #2e7d32;
            color: #1b4d1b;
        }
        .btn-outline:hover { background: #e9f5e9; }

        .btn-wa {
            background: #25D366;
        }
        .btn-wa:hover { background: #128C7E; }

        .btn-danger { background: #c62828; }
        .btn-danger:hover { background: #b71c1c; }

        input, textarea, select {
            width: 100%;
            padding: 12px 16px;
            border-radius: 28px;
            border: 1px solid #cfe3cf;
            background: #ffffff;
            font-size: 0.9rem;
            outline: none;
        }
        input:focus, textarea:focus, select:focus {
            border-color: #2e7d32;
            box-shadow: 0 0 0 3px rgba(46,125,50,0.2);
        }

        label {
            font-weight: 600;
            color: #1f3b1f;
            margin-bottom: 6px;
            display: block;
            font-size: 0.85rem;
        }

        .form-group { margin-bottom: 20px; }

        /* Hero */
        .hero {
            text-align: center;
            margin-bottom: 40px;
            background: rgba(46, 125, 50, 0.12);
            border-radius: 64px;
            padding: 32px 20px;
            backdrop-filter: blur(4px);
            border: 1px solid #81c784;
        }
        .hero h1 { font-size: 2.8rem; color: #1a3b1a; }
        .hero h1 small { font-size: 1.2rem; }

        /* stats panel */
        .stats-row {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin: 25px 0;
            flex-wrap: wrap;
        }
        .stat-card {
            background: white;
            border-radius: 48px;
            padding: 16px 28px;
            box-shadow: 0 6px 14px rgba(0,0,0,0.05);
            text-align: center;
            min-width: 150px;
        }
        .stat-number { font-size: 2.2rem; font-weight: bold; color: #2e7d32; }
        .stat-label { font-weight: 500; color: #2c5e2c; }

        /* classmates grid */
        .classmates-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 28px;
            margin-top: 32px;
        }
        .profile-card {
            background: white;
            border-radius: 36px;
            overflow: hidden;
            transition: 0.25s;
            box-shadow: 0 12px 24px -12px rgba(0, 0, 0, 0.2);
            border: 1px solid #b9e0b2;
        }
        .profile-card:hover { transform: translateY(-5px); }
        .card-img {
            width: 100%;
            height: 200px;
            background: #dcedc8;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .card-img img { width: 100%; height: 100%; object-fit: cover; }
        .avatar-placeholder {
            font-size: 4rem;
            background: #a5d6a7;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card-body { padding: 20px; }
        .card-body h3 { font-size: 1.4rem; color: #1f4f1f; }
        .badge {
            background: #e8f0e8;
            padding: 4px 12px;
            border-radius: 50px;
            font-size: 0.7rem;
            font-weight: bold;
            color: #2c6e2c;
            display: inline-block;
            margin: 4px 4px 0 0;
        }
        .action-buttons {
            display: flex;
            gap: 10px;
            margin-top: 16px;
            flex-wrap: wrap;
        }
        .action-buttons button { flex: 1; padding: 8px; font-size: 0.75rem; }

        /* search */
        .search-bar {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            margin: 20px 0 10px;
        }
        .search-bar input { flex: 2; min-width: 200px; }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-color: rgba(0, 20, 0, 0.75);
            backdrop-filter: blur(6px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: white;
            max-width: 600px;
            width: 90%;
            border-radius: 48px;
            padding: 28px;
            max-height: 85vh;
            overflow-y: auto;
        }
        .close-modal { float: right; font-size: 28px; cursor: pointer; color: #2e7d32; }

        .auth-tabs {
            display: flex;
            gap: 20px;
            margin-bottom: 24px;
            border-bottom: 2px solid #c8e6c9;
        }
        .tab {
            padding: 12px 0;
            font-weight: bold;
            cursor: pointer;
            color: #4b6e4b;
        }
        .tab.active { color: #1b5e20; border-bottom: 3px solid #2e7d32; }

        .welcome-greeting {
            background: #e6f4e6;
            padding: 12px 24px;
            border-radius: 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 28px;
        }
        .footer {
            text-align: center;
            margin-top: 60px;
            padding: 24px;
            border-top: 1px solid #a5d6a7;
            color: #2b5e2b;
        }
        @media (max-width: 680px) {
            .hero h1 { font-size: 1.8rem; }
            .app-container { padding: 16px; }
        }
        .whatsapp-chat-btn {
            background: #25D36610;
            border: 1px solid #25D366;
            color: #075e54;
        }
    </style>
</head>
<body>
<div class="app-container" id="appRoot"></div>

<script>
    // ---------- STORAGE ----------
    const STORAGE_KEY = "saadah_alumni_pure_db";
    let alumniData = [];      // no example students by default
    let currentUserEmail = null;

    // load / init empty database (NO example students)
    function loadData() {
        const stored = localStorage.getItem(STORAGE_KEY);
        if(stored) {
            alumniData = JSON.parse(stored);
        } else {
            alumniData = [];   // completely empty — no placeholder students
            saveData();
        }
    }

    function saveData() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(alumniData));
    }

    // Helper functions
    function registerUser(fullName, email, password, phone, address, bio, gender, photoBase64 = "") {
        if(alumniData.some(u => u.email === email)) return { success: false, message: "Email already registered!" };
        const newId = Date.now().toString();
        const newUser = {
            id: newId,
            fullName: fullName.trim(),
            email: email.trim(),
            password: password,
            phone: phone.trim(),
            address: address.trim(),
            bio: bio || "",
            gender: gender,   // "male" or "female"
            photoUrl: photoBase64 || "",   // base64 string or empty
            registeredAt: new Date().toISOString()
        };
        alumniData.push(newUser);
        saveData();
        return { success: true, user: newUser };
    }

    function loginUser(email, password) {
        const user = alumniData.find(u => u.email === email && u.password === password);
        if(user) return { success: true, user };
        return { success: false, message: "Invalid email or password" };
    }

    function updateProfile(id, updates) {
        const index = alumniData.findIndex(u => u.id === id);
        if(index !== -1) {
            alumniData[index] = { ...alumniData[index], ...updates };
            saveData();
            return true;
        }
        return false;
    }

    function deleteProfile(id) {
        alumniData = alumniData.filter(u => u.id !== id);
        saveData();
        if(currentUserEmail && !alumniData.some(u => u.email === currentUserEmail)) {
            currentUserEmail = null;
        }
        return true;
    }

    function getCurrentUser() {
        if(!currentUserEmail) return null;
        return alumniData.find(u => u.email === currentUserEmail) || null;
    }

    // Statistics: male/female count + total
    function getGenderStats() {
        const male = alumniData.filter(u => u.gender === 'male').length;
        const female = alumniData.filter(u => u.gender === 'female').length;
        return { male, female, total: alumniData.length };
    }

    // search & filter states
    let currentSearch = "";

    function filteredClassmates() {
        let list = alumniData;
        if(currentSearch) {
            const term = currentSearch.toLowerCase();
            list = list.filter(m => m.fullName.toLowerCase().includes(term) ||
                (m.bio && m.bio.toLowerCase().includes(term)) ||
                (m.address && m.address.toLowerCase().includes(term)) ||
                (m.phone && m.phone.includes(term)));
        }
        return list;
    }

    // Helper convert image file to base64
    function fileToBase64(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => resolve(reader.result);
            reader.onerror = error => reject(error);
        });
    }

    // ---------- RENDER ENGINE ----------
    function render() {
        const app = document.getElementById("appRoot");
        const currentUser = getCurrentUser();
        const isLoggedIn = !!currentUser;
        const classmates = filteredClassmates();
        const stats = getGenderStats();

        let html = `
            <div class="hero">
                <h1>🎓 SA'ADAH INTERNATIONAL SCHOOL <br><small>ALUMNI CLASSMATES CONNECT</small></h1>
                <p style="margin-top: 12px;">🏫 Since 2011 — Reunite, Network & Thrive Together 🌍</p>
                <div class="stats-row">
                    <div class="stat-card"><div class="stat-number">${stats.total}</div><div class="stat-label">Total Alumni</div></div>
                    <div class="stat-card"><div class="stat-number">👨 ${stats.male}</div><div class="stat-label">Male</div></div>
                    <div class="stat-card"><div class="stat-number">👩 ${stats.female}</div><div class="stat-label">Female</div></div>
                </div>
            </div>
        `;

        if(!isLoggedIn) {
            // AUTH FORMS
            html += `
                <div class="card" style="max-width: 600px; margin: 0 auto 40px;">
                    <div class="auth-tabs" id="authTabs">
                        <div class="tab active" data-tab="login">🔐 Login</div>
                        <div class="tab" data-tab="register">✨ Register as Alumni</div>
                    </div>
                    <div id="authFormContainer"></div>
                    <p style="margin-top:18px; font-size:12px; text-align:center;">📌 Join the official network – share your journey, connect with WhatsApp, and stay in touch!</p>
                </div>
            `;
        } else {
            // LOGGED IN VIEW
            html += `
                <div class="welcome-greeting">
                    <div>👋 <strong>${escapeHtml(currentUser.fullName)}</strong> | ${escapeHtml(currentUser.email)}</div>
                    <div>
                        <button class="btn btn-outline" id="editOwnProfileBtn" style="margin-right:12px;">✏️ Edit My Info</button>
                        <button class="btn" id="logoutBtn">🚪 Logout</button>
                    </div>
                </div>
                <div class="card">
                    <div style="display: flex; justify-content: space-between; flex-wrap: wrap; align-items: center;">
                        <h2>📖 Alumni Directory (${classmates.length} members)</h2>
                        <button class="btn" id="showAddModalBtn" style="background:#1b5e20;">+ Register New Classmate</button>
                    </div>
                    <div class="search-bar">
                        <input type="text" id="searchInput" placeholder="🔍 Search by name, bio, address, phone..." value="${escapeHtml(currentSearch)}">
                    </div>
                </div>
                <div class="classmates-grid" id="classmatesGrid">
            `;
            if(classmates.length === 0) {
                html += `<div class="card" style="grid-column:1/-1; text-align:center;">🌟 No classmates yet. Be the first to register or add a friend!</div>`;
            } else {
                classmates.forEach(member => {
                    const isOwner = (currentUserEmail === member.email);
                    const whatsappNumber = member.phone ? member.phone.replace(/\s+/g, '') : '';
                    const waLink = whatsappNumber ? `https://wa.me/${whatsappNumber}` : '#';
                    html += `
                        <div class="profile-card" data-id="${member.id}">
                            <div class="card-img">
                                ${member.photoUrl ? `<img src="${member.photoUrl}" alt="photo" onerror="this.src='https://ui-avatars.com/api/?background=2e7d32&color=fff&name=${encodeURIComponent(member.fullName)}'">` : `<div class="avatar-placeholder">${member.gender === 'male' ? '👨‍🎓' : '👩‍🎓'}</div>`}
                            </div>
                            <div class="card-body">
                                <h3>${escapeHtml(member.fullName)} ${member.gender === 'male' ? '♂️' : '♀️'}</h3>
                                <p><span class="badge">📞 ${escapeHtml(member.phone || "—")}</span> <span class="badge">📍 ${escapeHtml(member.address || "—")}</span></p>
                                <p style="margin: 12px 0; font-size:0.85rem; color:#2f4d2f;">📝 ${escapeHtml(member.bio?.substring(0, 120) || "No bio yet...")}</p>
                                <div class="action-buttons">
                                    ${member.phone ? `<a href="${waLink}" target="_blank" class="btn btn-wa" style="text-decoration:none; text-align:center; display:inline-block;">💬 WhatsApp Chat</a>` : '<button disabled class="btn-outline">📱 No WhatsApp</button>'}
                                    ${isOwner ? `<button class="btn-outline edit-member-btn" data-id="${member.id}">✏️ Edit</button>` : ''}
                                    ${isOwner ? `<button class="btn-danger delete-member-btn" data-id="${member.id}">🗑️ Delete</button>` : ''}
                                </div>
                                ${!isOwner && isLoggedIn ? `<div class="badge" style="margin-top:12px; background:#e0f2e0;">👥 Connect via WhatsApp above</div>` : ''}
                            </div>
                        </div>
                    `;
                });
            }
            html += `</div>`;
        }

        // Footer
        html += `
            <div class="footer">
                © Sa'adah International School 2026 | Alumni Since 2011<br>
                Created by <strong>Muhammad Naim Muhammad</strong> (BSc Biotechnology, Federal University of Technology Babura) — Founder & Developer<br>
                🌐 Connect | Share | Inspire
            </div>
        `;

        app.innerHTML = html;

        if(!isLoggedIn) {
            renderAuthForm('login');
            const loginTab = document.querySelector('[data-tab="login"]');
            const registerTab = document.querySelector('[data-tab="register"]');
            if(loginTab) loginTab.addEventListener('click', () => { renderAuthForm('login'); setActiveTab('login'); });
            if(registerTab) registerTab.addEventListener('click', () => { renderAuthForm('register'); setActiveTab('register'); });
        } else {
            document.getElementById("logoutBtn")?.addEventListener("click", () => { currentUserEmail = null; render(); });
            document.getElementById("searchInput")?.addEventListener("input", (e) => { currentSearch = e.target.value; render(); });
            document.getElementById("showAddModalBtn")?.addEventListener("click", () => showProfileModal(null));
            document.getElementById("editOwnProfileBtn")?.addEventListener("click", () => { if(currentUser) showProfileModal(currentUser); });
            document.querySelectorAll(".edit-member-btn").forEach(btn => {
                btn.addEventListener("click", (e) => {
                    const id = btn.getAttribute("data-id");
                    const member = alumniData.find(m => m.id === id);
                    if(member) showProfileModal(member);
                });
            });
            document.querySelectorAll(".delete-member-btn").forEach(btn => {
                btn.addEventListener("click", (e) => {
                    if(confirm("⚠️ Permanently delete this profile?")) {
                        const id = btn.getAttribute("data-id");
                        deleteProfile(id);
                        render();
                    }
                });
            });
        }
    }

    function setActiveTab(tabName) {
        const tabs = document.querySelectorAll('.tab');
        tabs.forEach(t => t.classList.remove('active'));
        const active = document.querySelector(`[data-tab="${tabName}"]`);
        if(active) active.classList.add('active');
    }

    function renderAuthForm(type) {
        const container = document.getElementById("authFormContainer");
        if(!container) return;
        if(type === 'login') {
            container.innerHTML = `
                <div class="form-group"><label>📧 Email</label><input type="email" id="loginEmail" placeholder="alumni@saadah.edu"></div>
                <div class="form-group"><label>🔒 Password</label><input type="password" id="loginPassword" placeholder="********"></div>
                <button class="btn" id="doLoginBtn" style="width:100%;">Login to Alumni Hub</button>
            `;
            document.getElementById("doLoginBtn")?.addEventListener("click", () => {
                const email = document.getElementById("loginEmail").value.trim();
                const pwd = document.getElementById("loginPassword").value;
                const res = loginUser(email, pwd);
                if(res.success) {
                    currentUserEmail = res.user.email;
                    render();
                } else alert(res.message);
            });
        } else {
            container.innerHTML = `
                <div class="form-group"><label>📛 Full Name *</label><input id="regName" placeholder="e.g., Aisha Bello"></div>
                <div class="form-group"><label>📧 Email *</label><input id="regEmail" type="email" placeholder="you@example.com"></div>
                <div class="form-group"><label>🔑 Password * (min 4 chars)</label><input id="regPassword" type="password"></div>
                <div class="form-group"><label>👫 Gender *</label><select id="regGender"><option value="male">Male ♂️</option><option value="female">Female ♀️</option></select></div>
                <div class="form-group"><label>📞 Phone Number (for WhatsApp chat)</label><input id="regPhone" placeholder="+234 80X XXX XXXX"></div>
                <div class="form-group"><label>🏠 Address</label><input id="regAddress" placeholder="City, State, Country"></div>
                <div class="form-group"><label>📖 Biography / About You</label><textarea id="regBio" rows="2" placeholder="Your journey since graduation..."></textarea></div>
                <div class="form-group"><label>🖼️ Upload Photo (optional)</label><input type="file" id="regPhotoFile" accept="image/*"></div>
                <button class="btn" id="doRegisterBtn" style="width:100%;">✅ Register & Join Network</button>
                <p style="font-size:12px; margin-top:14px;">*Your photo will be stored as base64, you can also update later.</p>
            `;
            document.getElementById("doRegisterBtn")?.addEventListener("click", async () => {
                const name = document.getElementById("regName").value.trim();
                const email = document.getElementById("regEmail").value.trim();
                const pwd = document.getElementById("regPassword").value;
                const gender = document.getElementById("regGender").value;
                const phone = document.getElementById("regPhone").value;
                const address = document.getElementById("regAddress").value;
                const bio = document.getElementById("regBio").value;
                const photoFile = document.getElementById("regPhotoFile").files[0];
                if(!name || !email || !pwd || !gender) { alert("Full name, email, password and gender required!"); return; }
                if(pwd.length < 4) { alert("Password must be at least 4 characters"); return; }
                let photoBase64 = "";
                if(photoFile) {
                    if(photoFile.size > 2 * 1024 * 1024) { alert("Photo too large, max 2MB."); return; }
                    photoBase64 = await fileToBase64(photoFile);
                }
                const res = registerUser(name, email, pwd, phone, address, bio, gender, photoBase64);
                if(res.success) {
                    alert("Registration successful! Please login.");
                    renderAuthForm('login');
                    setActiveTab('login');
                } else alert(res.message);
            });
        }
    }

    // Modal for adding/editing (with photo upload and gender)
    function showProfileModal(member) {
        const isEdit = !!member;
        const modalDiv = document.createElement("div");
        modalDiv.className = "modal";
        modalDiv.style.display = "flex";
        const title = isEdit ? "Edit Your Profile" : "➕ Register New Classmate";
        const defaultData = isEdit ? member : { fullName: "", email: "", phone: "", address: "", bio: "", photoUrl: "", gender: "male", password: "" };
        modalDiv.innerHTML = `
            <div class="modal-content">
                <span class="close-modal">&times;</span>
                <h2 style="color:#1f4f1f;">${title}</h2>
                <div class="form-group"><label>Full Name *</label><input id="modalFullName" value="${escapeHtml(defaultData.fullName)}"></div>
                <div class="form-group"><label>Email *</label><input id="modalEmail" value="${escapeHtml(defaultData.email)}" ${isEdit ? 'readonly' : ''}></div>
                ${!isEdit ? `<div class="form-group"><label>Password * (min 4)</label><input id="modalPassword" type="password" placeholder="create password"></div>` : ''}
                <div class="form-group"><label>Gender *</label><select id="modalGender"><option value="male" ${defaultData.gender === 'male' ? 'selected' : ''}>Male ♂️</option><option value="female" ${defaultData.gender === 'female' ? 'selected' : ''}>Female ♀️</option></select></div>
                <div class="form-group"><label>📞 Phone (WhatsApp number)</label><input id="modalPhone" value="${escapeHtml(defaultData.phone || '')}" placeholder="+234..."></div>
                <div class="form-group"><label>Address</label><input id="modalAddress" value="${escapeHtml(defaultData.address || '')}"></div>
                <div class="form-group"><label>Biography</label><textarea id="modalBio" rows="3">${escapeHtml(defaultData.bio || '')}</textarea></div>
                <div class="form-group"><label>📸 Profile Photo (upload new)</label><input type="file" id="modalPhotoFile" accept="image/*"></div>
                ${defaultData.photoUrl ? `<div style="margin-bottom:12px;"><img src="${defaultData.photoUrl}" style="width:70px; height:70px; border-radius:50%; object-fit:cover;"></div>` : ''}
                <div style="display:flex; gap:12px; justify-content:flex-end;">
                    <button class="btn-outline" id="cancelModalBtn">Cancel</button>
                    <button class="btn" id="saveModalBtn">${isEdit ? "Update Profile" : "Create Profile"}</button>
                </div>
            </div>
        `;
        document.body.appendChild(modalDiv);
        const closeModal = () => modalDiv.remove();
        modalDiv.querySelector(".close-modal").addEventListener("click", closeModal);
        modalDiv.querySelector("#cancelModalBtn").addEventListener("click", closeModal);

        modalDiv.querySelector("#saveModalBtn").addEventListener("click", async () => {
            const fullName = document.getElementById("modalFullName").value.trim();
            const email = document.getElementById("modalEmail").value.trim();
            const gender = document.getElementById("modalGender").value;
            const phone = document.getElementById("modalPhone").value;
            const address = document.getElementById("modalAddress").value;
            const bio = document.getElementById("modalBio").value;
            const photoFile = document.getElementById("modalPhotoFile").files[0];
            if(!fullName || !email || !gender) { alert("Name, email and gender required"); return; }
            let photoBase64 = defaultData.photoUrl || "";
            if(photoFile) {
                if(photoFile.size > 2 * 1024 * 1024) { alert("Image <2MB"); return; }
                photoBase64 = await fileToBase64(photoFile);
            }
            if(isEdit) {
                const updates = { fullName, email, phone, address, bio, gender, photoUrl: photoBase64 };
                if(updateProfile(member.id, updates)) {
                    if(currentUserEmail === member.email) currentUserEmail = email;
                    alert("Profile updated!");
                    closeModal();
                    render();
                } else alert("Error");
            } else {
                const password = document.getElementById("modalPassword")?.value;
                if(!password || password.length < 4) { alert("Password required (min 4 chars)"); return; }
                const res = registerUser(fullName, email, password, phone, address, bio, gender, photoBase64);
                if(res.success) {
                    alert("New classmate added!");
                    closeModal();
                    render();
                } else alert(res.message);
            }
        });
    }

    function escapeHtml(str) { if(!str) return ""; return str.replace(/[&<>]/g, function(m) { if(m === '&') return '&amp;'; if(m === '<') return '&lt;'; if(m === '>') return '&gt;'; return m;}); }

    loadData();
    render();
</script>
