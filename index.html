<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Sa'adah International School | Alumni Connect</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Poppins', system-ui, -apple-system, 'Inter', sans-serif;
        }

        body {
            background: linear-gradient(145deg, #e8f5e9 0%, #c8e6c9 100%);
            min-height: 100vh;
        }

        /* main container */
        .app-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px 24px 40px;
        }

        /* cards & UI */
        .card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(2px);
            border-radius: 32px;
            box-shadow: 0 20px 35px -12px rgba(0, 32, 0, 0.25);
            padding: 28px 32px;
            transition: all 0.2s ease;
            border: 1px solid rgba(70, 130, 70, 0.2);
        }

        .btn {
            border: none;
            background: #2e7d32;
            color: white;
            font-weight: 600;
            padding: 12px 28px;
            border-radius: 60px;
            cursor: pointer;
            font-size: 0.95rem;
            transition: 0.2s;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }

        .btn:hover {
            background: #1b5e20;
            transform: scale(1.02);
            box-shadow: 0 8px 18px rgba(30, 80, 0, 0.2);
        }

        .btn-outline {
            background: transparent;
            border: 2px solid #2e7d32;
            color: #1b4d1b;
        }

        .btn-outline:hover {
            background: #e9f5e9;
        }

        .btn-danger {
            background: #c62828;
        }
        .btn-danger:hover {
            background: #b71c1c;
        }

        input, textarea, select {
            width: 100%;
            padding: 12px 16px;
            border-radius: 28px;
            border: 1px solid #cfe3cf;
            background: #ffffff;
            font-size: 0.9rem;
            transition: 0.2s;
            outline: none;
        }

        input:focus, textarea:focus, select:focus {
            border-color: #2e7d32;
            box-shadow: 0 0 0 3px rgba(46,125,50,0.2);
        }

        label {
            font-weight: 600;
            color: #1f3b1f;
            margin-bottom: 6px;
            display: block;
            font-size: 0.85rem;
        }

        .form-group {
            margin-bottom: 20px;
        }

        /* header */
        .hero {
            text-align: center;
            margin-bottom: 40px;
            background: rgba(46, 125, 50, 0.1);
            border-radius: 64px;
            padding: 32px 20px;
            backdrop-filter: blur(4px);
            border: 1px solid #81c784;
        }

        .hero h1 {
            font-size: 2.8rem;
            color: #1a3b1a;
            letter-spacing: -0.5px;
        }

        .hero p {
            color: #2c5e2c;
            font-weight: 500;
        }

        /* grid for classmates cards */
        .classmates-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 28px;
            margin-top: 32px;
        }

        .profile-card {
            background: white;
            border-radius: 36px;
            overflow: hidden;
            transition: all 0.25s;
            box-shadow: 0 12px 24px -12px rgba(0, 0, 0, 0.2);
            border: 1px solid #b9e0b2;
        }

        .profile-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 28px 32px -16px rgba(30, 70, 20, 0.3);
        }

        .card-img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            background: #cfe9cf;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #dcedc8;
            color: #2e572e;
            font-size: 3rem;
        }

        .card-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card-body {
            padding: 20px;
        }

        .card-body h3 {
            font-size: 1.5rem;
            color: #1f4f1f;
        }

        .badge {
            background: #e8f0e8;
            padding: 4px 12px;
            border-radius: 50px;
            font-size: 0.7rem;
            font-weight: bold;
            color: #2c6e2c;
            display: inline-block;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
            margin-top: 16px;
        }

        .action-buttons button {
            flex: 1;
            padding: 8px;
            font-size: 0.8rem;
        }

        /* search & filter bar */
        .search-bar {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            margin-bottom: 20px;
            align-items: center;
        }
        .search-bar input {
            flex: 2;
            min-width: 200px;
        }
        .filter-group {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        /* modal overlay */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-color: rgba(0, 20, 0, 0.7);
            backdrop-filter: blur(6px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: white;
            max-width: 550px;
            width: 90%;
            border-radius: 48px;
            padding: 28px;
            max-height: 85vh;
            overflow-y: auto;
        }
        .close-modal {
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            color: #2e7d32;
        }

        /* footer */
        .footer {
            text-align: center;
            margin-top: 60px;
            padding: 24px;
            border-top: 1px solid #a5d6a7;
            color: #2b5e2b;
            font-weight: 500;
        }

        /* auth toggle */
        .auth-tabs {
            display: flex;
            gap: 20px;
            margin-bottom: 24px;
            border-bottom: 2px solid #c8e6c9;
        }
        .tab {
            padding: 12px 0;
            font-weight: bold;
            cursor: pointer;
            color: #4b6e4b;
        }
        .tab.active {
            color: #1b5e20;
            border-bottom: 3px solid #2e7d32;
        }

        .welcome-greeting {
            background: #e6f4e6;
            padding: 12px 20px;
            border-radius: 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 28px;
        }

        @media (max-width: 680px) {
            .app-container { padding: 16px; }
            .hero h1 { font-size: 1.8rem; }
        }
    </style>
</head>
<body>
<div class="app-container" id="appRoot">
    <!-- dynamic rendering via JS -->
</div>

<script>
    // ---------- DATA MODEL ----------
    // Key for localStorage
    const STORAGE_KEY = "saadah_alumni_db";
    // default seed data
    let alumniData = [];

    // current logged in user (store email as session)
    let currentUserEmail = null;

    // Helper: load from localStorage
    function loadData() {
        const stored = localStorage.getItem(STORAGE_KEY);
        if(stored) {
            alumniData = JSON.parse(stored);
        } else {
            // Seed some classmates for demo
            alumniData = [
                { id: "1", fullName: "Aisha Abubakar", email: "aisha@example.com", password: "pass123", phone: "+234 802 123 4567", address: "Kano, Nigeria", bio: "Medical student, love reading and volunteering.", photoUrl: "", registeredAt: new Date().toISOString() },
                { id: "2", fullName: "Ibrahim Musa", email: "ibrahim@example.com", password: "pass123", phone: "+234 803 987 6543", address: "Kaduna, Nigeria", bio: "Software engineer & tech enthusiast.", photoUrl: "" },
                { id: "3", fullName: "Fatima Suleiman", email: "fatima@example.com", password: "pass123", phone: "+234 805 111 2233", address: "Abuja, FCT", bio: "Entrepreneur, fashion designer.", photoUrl: "" }
            ];
            saveData();
        }
        // ensure each has photoUrl fallback
        alumniData = alumniData.map(m => ({ ...m, photoUrl: m.photoUrl || "" }));
    }

    function saveData() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(alumniData));
    }

    // Helper: register new user
    function registerUser(fullName, email, password, phone, address, bio, photoUrl = "") {
        if(alumniData.some(u => u.email === email)) return { success: false, message: "Email already registered!" };
        const newId = Date.now().toString();
        const newUser = {
            id: newId,
            fullName,
            email,
            password,   // plain for demo (no hashing for simplicity)
            phone,
            address,
            bio: bio || "",
            photoUrl: photoUrl || "",
            registeredAt: new Date().toISOString()
        };
        alumniData.push(newUser);
        saveData();
        return { success: true, user: newUser };
    }

    function loginUser(email, password) {
        const user = alumniData.find(u => u.email === email && u.password === password);
        if(user) return { success: true, user };
        return { success: false, message: "Invalid email or password" };
    }

    // Update profile
    function updateProfile(id, updates) {
        const index = alumniData.findIndex(u => u.id === id);
        if(index !== -1) {
            alumniData[index] = { ...alumniData[index], ...updates };
            saveData();
            return true;
        }
        return false;
    }

    function deleteProfile(id) {
        alumniData = alumniData.filter(u => u.id !== id);
        saveData();
        if(currentUserEmail && !alumniData.some(u => u.email === currentUserEmail)) {
            currentUserEmail = null; // logout if deleted self
        }
        return true;
    }

    // get current user object
    function getCurrentUser() {
        if(!currentUserEmail) return null;
        return alumniData.find(u => u.email === currentUserEmail) || null;
    }

    // ---------- RENDER ENGINE ----------
    let currentFilter = "";
    let currentSearch = "";

    function filteredClassmates() {
        let list = alumniData;
        if(currentSearch) {
            const term = currentSearch.toLowerCase();
            list = list.filter(m => m.fullName.toLowerCase().includes(term) || 
                (m.bio && m.bio.toLowerCase().includes(term)) ||
                (m.address && m.address.toLowerCase().includes(term)));
        }
        // if filter? just a demo filter by name prefix? we can add simple but fine.
        return list;
    }

    // global modal state
    let activeModal = null; // 'register', 'login', 'editProfile'

    function render() {
        const app = document.getElementById("appRoot");
        const currentUser = getCurrentUser();
        const isLoggedIn = !!currentUser;
        const classmates = filteredClassmates();

        // Build HTML
        let html = `
            <div class="hero">
                <h1>🎓 ALUMNI CLASSMATES CONNECT</h1>
                <p>Sa'adah International School — Reunite, Share & Grow Together 🌍</p>
                <div style="margin-top:12px;"><span class="badge">📅 Since 2005</span> <span class="badge">❤️ 500+ alumni</span></div>
            </div>
        `;

        if(!isLoggedIn) {
            // ----- NOT LOGGED IN: show auth cards -----
            html += `
                <div class="card" style="max-width: 560px; margin: 0 auto 40px auto;">
                    <div class="auth-tabs" id="authTabs">
                        <div class="tab active" data-tab="login">🔐 Login</div>
                        <div class="tab" data-tab="register">✨ Register</div>
                    </div>
                    <div id="authFormContainer">
                        <!-- dynamic login/register form -->
                    </div>
                </div>
                <div style="text-align:center; margin-top: 20px;">
                    <p style="color:#2c5e2c;">⭐ Join our official alumni network ⭐</p>
                </div>
            `;
        } else {
            // LOGGED IN: welcome + classmates grid + add/edit
            html += `
                <div class="welcome-greeting">
                    <div>👋 <strong>${escapeHtml(currentUser.fullName)}</strong>  |  ${escapeHtml(currentUser.email)}</div>
                    <div>
                        <button class="btn btn-outline" id="editOwnProfileBtn" style="margin-right:12px;">✏️ Edit my info</button>
                        <button class="btn" id="logoutBtn">🚪 Logout</button>
                    </div>
                </div>
                <div class="card">
                    <div style="display: flex; justify-content: space-between; flex-wrap: wrap; align-items: center;">
                        <h2>📇 Classmates Directory (${classmates.length} members)</h2>
                        <button class="btn" id="showAddModalBtn" style="background:#1b5e20;">+ Add New Classmate</button>
                    </div>
                    <div class="search-bar" style="margin-top: 20px;">
                        <input type="text" id="searchInput" placeholder="🔍 Search by name, bio, address..." value="${escapeHtml(currentSearch)}">
                        <div class="filter-group">
                            <span style="font-size:0.8rem;">🔎</span>
                        </div>
                    </div>
                </div>
                <div class="classmates-grid" id="classmatesGrid">
            `;
            if(classmates.length === 0) {
                html += `<div class="card" style="grid-column:1/-1; text-align:center;">No classmates found. Add someone! 👨‍🎓👩‍🎓</div>`;
            } else {
                classmates.forEach(member => {
                    const isOwner = (currentUserEmail === member.email);
                    html += `
                        <div class="profile-card" data-id="${member.id}">
                            <div class="card-img">
                                ${member.photoUrl ? `<img src="${escapeHtml(member.photoUrl)}" alt="photo" onerror="this.src='https://ui-avatars.com/api/?background=2e7d32&color=fff&name=${encodeURIComponent(member.fullName)}'">` : `<div style="display:flex;align-items:center;justify-content:center;height:100%;background:#c8e6c9;font-size:3rem;">📸</div>`}
                            </div>
                            <div class="card-body">
                                <h3>${escapeHtml(member.fullName)}</h3>
                                <p><span class="badge">📞 ${escapeHtml(member.phone || "—")}</span> <span class="badge">📍 ${escapeHtml(member.address || "—")}</span></p>
                                <p style="margin: 12px 0; font-size:0.85rem; color:#2f4d2f;">📝 ${escapeHtml(member.bio?.substring(0, 100) || "No bio yet...")}</p>
                                <div class="action-buttons">
                                    ${isOwner ? `<button class="btn-outline edit-member-btn" data-id="${member.id}" style="background:#d4e2d4;">✏️ Edit</button>` : ''}
                                    ${isOwner ? `<button class="btn-danger delete-member-btn" data-id="${member.id}">🗑️ Delete</button>` : ''}
                                    ${!isOwner && isLoggedIn ? '<button disabled style="opacity:0.5; background:#ccc;">View only</button>' : ''}
                                </div>
                            </div>
                        </div>
                    `;
                });
            }
            html += `</div>`;
        }

        // FOOTER with copyright & credit
        html += `
            <div class="footer">
                © Sa'adah International School 2026 | Alumni Connect Platform <br>
                Created by <strong>Muhammad Naim Muhammad</strong> (BSc Biotechnology, Federal University of Technology Babura) — Founder & Web Developer
            </div>
        `;

        app.innerHTML = html;

        // if not logged in, attach auth logic + dynamic form render
        if(!isLoggedIn) {
            renderAuthForm('login');
            const loginTab = document.querySelector('[data-tab="login"]');
            const registerTab = document.querySelector('[data-tab="register"]');
            if(loginTab) loginTab.addEventListener('click', () => { renderAuthForm('login'); setActiveTab('login'); });
            if(registerTab) registerTab.addEventListener('click', () => { renderAuthForm('register'); setActiveTab('register'); });
        } else {
            // attach event listeners for logged-in view
            document.getElementById("logoutBtn")?.addEventListener("click", () => { currentUserEmail = null; render(); });
            document.getElementById("searchInput")?.addEventListener("input", (e) => { currentSearch = e.target.value; render(); });
            document.getElementById("showAddModalBtn")?.addEventListener("click", () => showProfileModal(null));
            document.getElementById("editOwnProfileBtn")?.addEventListener("click", () => { if(currentUser) showProfileModal(currentUser); });
            document.querySelectorAll(".edit-member-btn").forEach(btn => {
                btn.addEventListener("click", (e) => {
                    const id = btn.getAttribute("data-id");
                    const member = alumniData.find(m => m.id === id);
                    if(member) showProfileModal(member);
                });
            });
            document.querySelectorAll(".delete-member-btn").forEach(btn => {
                btn.addEventListener("click", (e) => {
                    if(confirm("⚠️ Permanently delete this profile?")) {
                        const id = btn.getAttribute("data-id");
                        deleteProfile(id);
                        render();
                    }
                });
            });
        }
    }

    function setActiveTab(tabName) {
        const tabs = document.querySelectorAll('.tab');
        tabs.forEach(t => t.classList.remove('active'));
        const active = document.querySelector(`[data-tab="${tabName}"]`);
        if(active) active.classList.add('active');
    }

    function renderAuthForm(type) {
        const container = document.getElementById("authFormContainer");
        if(!container) return;
        if(type === 'login') {
            container.innerHTML = `
                <div class="form-group"><label>📧 Email</label><input type="email" id="loginEmail" placeholder="your@email.com"></div>
                <div class="form-group"><label>🔒 Password</label><input type="password" id="loginPassword" placeholder="********"></div>
                <button class="btn" id="doLoginBtn" style="width:100%;">Login to Alumni Hub</button>
                <p style="margin-top: 18px; font-size:12px; text-align:center;">Demo: any seeded email (aisha@example.com / pass123)</p>
            `;
            document.getElementById("doLoginBtn")?.addEventListener("click", () => {
                const email = document.getElementById("loginEmail").value.trim();
                const pwd = document.getElementById("loginPassword").value;
                const res = loginUser(email, pwd);
                if(res.success) {
                    currentUserEmail = res.user.email;
                    render();
                } else {
                    alert(res.message);
                }
            });
        } else {
            container.innerHTML = `
                <div class="form-group"><label>📛 Full Name *</label><input id="regName" placeholder="Muhammad Naim"></div>
                <div class="form-group"><label>📧 Email *</label><input id="regEmail" type="email" placeholder="alumni@saadah.edu"></div>
                <div class="form-group"><label>🔑 Password *</label><input id="regPassword" type="password"></div>
                <div class="form-group"><label>📞 Phone Number</label><input id="regPhone" placeholder="+234..."></div>
                <div class="form-group"><label>🏠 Address</label><input id="regAddress" placeholder="City, Country"></div>
                <div class="form-group"><label>📖 Biography / About</label><textarea id="regBio" rows="2" placeholder="Share your journey..."></textarea></div>
                <div class="form-group"><label>🖼️ Photo URL (optional)</label><input id="regPhoto" placeholder="https://...image.jpg"></div>
                <button class="btn" id="doRegisterBtn" style="width:100%;">✨ Register & Join</button>
            `;
            document.getElementById("doRegisterBtn")?.addEventListener("click", () => {
                const name = document.getElementById("regName").value.trim();
                const email = document.getElementById("regEmail").value.trim();
                const pwd = document.getElementById("regPassword").value;
                const phone = document.getElementById("regPhone").value;
                const address = document.getElementById("regAddress").value;
                const bio = document.getElementById("regBio").value;
                const photo = document.getElementById("regPhoto").value;
                if(!name || !email || !pwd) { alert("Full name, email and password required!"); return; }
                const res = registerUser(name, email, pwd, phone, address, bio, photo);
                if(res.success) {
                    alert("Registration successful! Please login.");
                    renderAuthForm('login');
                    setActiveTab('login');
                } else {
                    alert(res.message);
                }
            });
        }
    }

    // Modal for adding/editing profile (full details)
    function showProfileModal(member) {
        const isEdit = !!member;
        const modalDiv = document.createElement("div");
        modalDiv.className = "modal";
        modalDiv.style.display = "flex";
        const title = isEdit ? "✏️ Edit Profile" : "➕ Add New Classmate";
        const defaultData = isEdit ? member : { fullName: "", email: "", phone: "", address: "", bio: "", photoUrl: "", password: "temp123" };
        modalDiv.innerHTML = `
            <div class="modal-content">
                <span class="close-modal">&times;</span>
                <h2 style="color:#1f4f1f;">${title}</h2>
                <div class="form-group"><label>Full Name *</label><input id="modalFullName" value="${escapeHtml(defaultData.fullName)}"></div>
                <div class="form-group"><label>Email *</label><input id="modalEmail" value="${escapeHtml(defaultData.email)}" ${isEdit ? 'readonly' : ''}></div>
                ${!isEdit ? `<div class="form-group"><label>Password * (min 4 chars)</label><input id="modalPassword" type="password" placeholder="create password"></div>` : ''}
                <div class="form-group"><label>Phone Number</label><input id="modalPhone" value="${escapeHtml(defaultData.phone || '')}"></div>
                <div class="form-group"><label>Address</label><input id="modalAddress" value="${escapeHtml(defaultData.address || '')}"></div>
                <div class="form-group"><label>Biography</label><textarea id="modalBio" rows="3">${escapeHtml(defaultData.bio || '')}</textarea></div>
                <div class="form-group"><label>Photo URL (image link)</label><input id="modalPhoto" value="${escapeHtml(defaultData.photoUrl || '')}" placeholder="https://..."></div>
                <div style="display:flex; gap:12px; justify-content:flex-end;">
                    <button class="btn-outline" id="cancelModalBtn">Cancel</button>
                    <button class="btn" id="saveModalBtn">${isEdit ? "Update Profile" : "Create Profile"}</button>
                </div>
            </div>
        `;
        document.body.appendChild(modalDiv);
        const closeModal = () => modalDiv.remove();
        modalDiv.querySelector(".close-modal").addEventListener("click", closeModal);
        modalDiv.querySelector("#cancelModalBtn").addEventListener("click", closeModal);
        modalDiv.querySelector("#saveModalBtn").addEventListener("click", () => {
            const fullName = document.getElementById("modalFullName").value.trim();
            const email = document.getElementById("modalEmail").value.trim();
            const phone = document.getElementById("modalPhone").value;
            const address = document.getElementById("modalAddress").value;
            const bio = document.getElementById("modalBio").value;
            const photoUrl = document.getElementById("modalPhoto").value;
            if(!fullName || !email) { alert("Name and Email required"); return; }
            if(isEdit) {
                const updates = { fullName, email, phone, address, bio, photoUrl };
                if(updateProfile(member.id, updates)) {
                    if(currentUserEmail === member.email) { currentUserEmail = email; }
                    alert("Profile updated!");
                    closeModal();
                    render();
                } else alert("Error updating");
            } else {
                const password = document.getElementById("modalPassword")?.value;
                if(!password || password.length < 3) { alert("Password required (min 3 chars)"); return; }
                const res = registerUser(fullName, email, password, phone, address, bio, photoUrl);
                if(res.success) {
                    alert("New classmate added successfully!");
                    closeModal();
                    render();
                } else alert(res.message);
            }
        });
    }

    function escapeHtml(str) { if(!str) return ""; return str.replace(/[&<>]/g, function(m) { if(m === '&') return '&amp;'; if(m === '<') return '&lt;'; if(m === '>') return '&gt;'; return m;}); }

    // initialize
    loadData();
    render();
    // check for session persistence - not needed beyond page refresh because currentUserEmail is memory only
    window.addEventListener('beforeunload', () => {});
</script>
</body>
</html>
